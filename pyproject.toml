[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "slurm-wtf"
version = "0.1.1"
description = "Where did the cluster capacity go? Interactive Slurm accounts, shared limits, and jobs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sam Young"}]
keywords = ["slurm", "hpc", "gpu", "terminal", "cluster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
wtf = "slurm_wtf.cli:main"

[project.urls]
Homepage = "https://github.com/youngsm/slurm-wtf"
Issues = "https://github.com/youngsm/slurm-wtf/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
